fixture-581.yaml:
  comment: 'Issue#581 : value and type checking in constraints'
  todo: 'this fixture puts constraints that overflow Go''s types into a document - "maximum: 9223372036854775807000", "18446744073709551615", "18446744073709551616" - to see what validate makes of them. It no longer gets that far: the YAML conversion refuses an integer beyond int64, so the document never unmarshals and no validator runs. What it demonstrates today is the unmarshalling error, and how little that error says - it names the offending value but not the field it came from, so a reader has to grep the document for it. There is no workaround in the current model, where a value becomes a Go type before anything can look at it. Reaching validation again needs the parser rewrite that drops early conversion to native types; expectedLoadError goes back to false then.'
  expectedLoadError: true
  expectedValid: false
  expectedMessages:
    - message: 'Expecting integer content: strconv.ParseInt: parsing "18446744073709551615": value out of range'
      withContinueOnErrors: false
      isRegexp: false
  expectedWarnings: []
