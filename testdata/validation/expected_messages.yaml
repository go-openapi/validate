fixture-constraints-on-numbers.yaml:
  comment: A supplement scenario for native vs float-based constraint verifications on integers (multipleOf,maximum, minimum).
  todo: 'This scenario supports current checks, that is for constraints on schemas with a default value only. It should be generalized (issue#581) and also for example values (issue#1231).

    param3 does not report "param3 in query should be a multiple of 10", though the fixture comment says it should. MultipleOf compares data/factor through conv.IsFloat64AJSONInteger, whose tolerance is relative: at a quotient of 2.1e8 it accepts an absolute remainder up to 0.2, and 2147483648/10 = 214748364.8 falls inside that. MultipleOfInt and MultipleOfUint decide the same numbers correctly, so only a value arriving as a float64 is affected.

    This is not a tolerance to retune. A relative error covers the borderline cases a fixed one misses, and any other metric would close this hole and open others: a float64 cannot answer the question in general. multipleOf is only decidable with decimal arithmetic, which is v2 work.'
  expectedLoadError: false
  expectedValid: false
  expectedMessages:
    - message: default value for param1 in query does not validate its schema
      withContinueOnErrors: false
      isRegexp: false
    - message: default value for param2 in query does not validate its schema
